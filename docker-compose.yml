services:
  db:
    image: postgres:16-alpine
    container_name: pinroute-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pinroute}
      POSTGRES_USER: ${POSTGRES_USER:-pinroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinroute}
    ports:
      # 로컬 DB 툴에서 localhost:5433으로 직접 접속 (5432는 호스트 Postgres와 충돌 회피)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinroute} -d ${POSTGRES_DB:-pinroute}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: pinroute-backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      # 컨테이너 사이에서는 서비스명 db, 내부 포트 5432로 접속한다.
      POSTGRES_DB: ${POSTGRES_DB:-pinroute}
      POSTGRES_USER: ${POSTGRES_USER:-pinroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinroute}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # 브라우저가 보내는 Origin은 호스트 기준(8002)이다.
      CORS_ALLOWED_ORIGINS: http://localhost:8002,http://127.0.0.1:8002
      # Step 3 숙소 검색(Google Places API New). 비어 있으면 검색 API가 503을 돌려준다.
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      # 소셜 로그인. 비어 있으면 해당 로그인 API가 503을 돌려준다.
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
    ports:
      - "8003:8000"
    volumes:
      # 코드 수정 시 runserver 자동 리로드
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: pinroute-frontend
    environment:
      # 브라우저에서 실행되는 코드이므로 컨테이너명(backend)이 아니라 호스트 주소를 쓴다.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8003/api/v1}
      # 소셜 로그인 인가 URL에 쓰는 공개 client id (백엔드와 같은 값)
      VITE_KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      VITE_NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
    ports:
      - "8002:8002"
    volumes:
      - ./frontend:/app
      # 호스트의 node_modules가 컨테이너 것을 덮어쓰지 않도록 익명 볼륨으로 보호
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
