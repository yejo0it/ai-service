services:
  db:
    # postgres:16-alpine + pgvector (db/Dockerfile)
    build: ./db
    container_name: pinroute-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pinroute}
      POSTGRES_USER: ${POSTGRES_USER:-pinroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinroute}
    ports:
      # 로컬 DB 툴에서 localhost:5433으로 직접 접속 (5432는 호스트 Postgres와 충돌 회피)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinroute} -d ${POSTGRES_DB:-pinroute}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: pinroute-backend
    environment:
      # 비어 있으면 개발(DEBUG=1)에서는 자동 생성, 운영에서는 시작하지 않는다(config/settings.py).
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      # 컨테이너 사이에서는 서비스명 db, 내부 포트 5432로 접속한다.
      POSTGRES_DB: ${POSTGRES_DB:-pinroute}
      POSTGRES_USER: ${POSTGRES_USER:-pinroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinroute}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # 브라우저가 보내는 Origin은 호스트 기준(8002)이다.
      CORS_ALLOWED_ORIGINS: http://localhost:8002,http://127.0.0.1:8002
      # Step 3 숙소 검색(Google Places API New). 비어 있으면 검색 API가 503을 돌려준다.
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      # 장소 사진 월 상한(과금 호출 수). 무료 한도(1,000건)보다 낮게 둔다. 0이면 사진을 끈다.
      PLACE_PHOTO_MONTHLY_LIMIT: ${PLACE_PHOTO_MONTHLY_LIMIT:-900}
      # 소셜 로그인. 비어 있으면 해당 로그인 API가 503을 돌려준다.
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      # 여행 상세 'AI와 함께 만들기'(Claude). 비어 있으면 AI API가 503을 돌려준다.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # AI 일정 제안의 실제 이동 시간 계산(Google Routes API). 비어 있으면 직선거리 기준으로 동작한다.
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}
      # 대중교통 이동 시간(NAVITIME Route, RapidAPI). 비어 있으면 대중교통 시간은 표시하지 않는다.
      NAVITIME_RAPIDAPI_KEY: ${NAVITIME_RAPIDAPI_KEY:-}
      ROUTES_ENABLED: ${ROUTES_ENABLED:-1}
      ROUTES_COUNTRIES: ${ROUTES_COUNTRIES:-JP,KR,TW,HK,MO,MN}
      ROUTES_CITIES: ${ROUTES_CITIES:-}
      # 일본 역 이름 한국어 표기 데이터 사용 여부(0이면 원어)
      STATION_NAMES_ENABLED: ${STATION_NAMES_ENABLED:-1}
      ROUTES_MAX_ELEMENTS_PER_PROPOSAL: ${ROUTES_MAX_ELEMENTS_PER_PROPOSAL:-300}
      ROUTES_USER_DAILY_ELEMENTS: ${ROUTES_USER_DAILY_ELEMENTS:-600}
      ROUTES_DAILY_ELEMENTS: ${ROUTES_DAILY_ELEMENTS:-3000}
      # 이메일 변경 인증 메일(SMTP). EMAIL_HOST가 비어 있으면 개발에서는 백엔드 로그로 출력한다.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-PinRoute <no-reply@pinroute.local>}
      # 인증 메일 속 링크가 가리키는 프론트 주소
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8002}
      # 로그인 만료 정책(일). 비활동: 마지막 사용자 활동 후 N일 / 절대: 로그인 후 N일
      AUTH_INACTIVITY_DAYS: ${AUTH_INACTIVITY_DAYS:-7}
      AUTH_ABSOLUTE_DAYS: ${AUTH_ABSOLUTE_DAYS:-30}
    ports:
      - "8003:8000"
    volumes:
      # 코드 수정 시 runserver 자동 리로드
      - ./backend:/app
      # 업로드한 프로필 사진. 코드 폴더와 분리해 컨테이너를 다시 만들어도 남긴다.
      - media:/app/media
      # 여행 사진(공개하지 않는 파일). 컨테이너를 다시 만들어도 남긴다.
      - private-media:/app/private_media
      # 여행 정보 검색(RAG) 임베딩 모델 캐시. 컨테이너를 다시 만들어도 모델을 다시 내려받지 않는다.
      - hf-cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    # 서버가 요청에 응답하는지 확인한다. 응답만 오면 정상으로 보므로(로그인 전 401 포함) 연결이 안 될 때만 unhealthy가 된다.
    # 시작 직후 마이그레이션 시간을 고려해 start_period를 둔다. 상태는 `docker compose ps`로 확인한다.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, urllib.error
          try:
              urllib.request.urlopen("http://127.0.0.1:8000/api/v1/auth/me/", timeout=3)
          except urllib.error.HTTPError:
              pass
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: pinroute-frontend
    environment:
      # 브라우저에서 실행되는 코드이므로 컨테이너명(backend)이 아니라 호스트 주소를 쓴다.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8003/api/v1}
      # 소셜 로그인 인가 URL에 쓰는 공개 client id (백엔드와 같은 값)
      VITE_KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      VITE_NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      # 일행 초대 카카오톡 공유(JavaScript SDK). 비어 있으면 링크 복사만 쓸 수 있다.
      VITE_KAKAO_JS_KEY: ${KAKAO_JS_KEY:-}
      # 여행 상세 지도(Maps JavaScript API). 브라우저에 노출되므로 서버용 Places 키와 분리한다.
      VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "8002:8002"
    volumes:
      - ./frontend:/app
      # 호스트의 node_modules가 컨테이너 것을 덮어쓰지 않도록 익명 볼륨으로 보호
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  media:
  private-media:
  hf-cache:
